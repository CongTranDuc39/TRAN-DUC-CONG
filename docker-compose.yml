services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-qlsv}
      MYSQL_USER: ${DB_USER:-qlsv_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Hãy đặt DB_PASSWORD trong môi trường hoặc file cấu hình cục bộ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Hãy đặt MYSQL_ROOT_PASSWORD trong môi trường hoặc file cấu hình cục bộ}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP --host=127.0.0.1 --user=\"$$MYSQL_USER\" --database=\"$$MYSQL_DATABASE\" --connect-timeout=3 --execute='SELECT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-qlsv}
      DB_USER: ${DB_USER:-qlsv_app}
      DB_PASSWORD: ${DB_PASSWORD:?Hãy đặt DB_PASSWORD trong môi trường hoặc file cấu hình cục bộ}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health', {signal: AbortSignal.timeout(3500)}).then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    expose:
      - "8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--timeout=4", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      PMA_ARBITRARY: "0"
    ports:
      - "127.0.0.1:5056:80"
    depends_on:
      db:
        condition: service_healthy

  mysql-exporter-init:
    image: qlsv-trancong-app
    build: .
    restart: "no"
    command: ["node", "scripts/bootstrap-monitoring.js"]
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-qlsv}
    secrets:
      - mysql_root_password
      - mysql_exporter_password
    depends_on:
      db:
        condition: service_healthy

  mysql-exporter:
    image: prom/mysqld-exporter:v0.20.0
    restart: unless-stopped
    command: ["--config.my-cnf=/run/secrets/mysql_exporter_client"]
    secrets:
      - mysql_exporter_client
    depends_on:
      mysql-exporter-init:
        condition: service_completed_successfully

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.1
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx:8080/stub_status"]
    depends_on:
      nginx:
        condition: service_healthy

  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --housekeeping_interval=10s
      - --containerd-namespace=moby
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  # Docker Desktop's containerd metrics omit Compose labels. Join this metadata
  # with cAdvisor measurements to identify only this project's containers.
  container-metadata:
    image: qlsv-trancong-app
    build: .
    restart: unless-stopped
    command: ["node", "scripts/container-metadata.js"]
    environment:
      PORT: "9256"
      PROJECT_NAME: qlsv-trancong
    group_add:
      - "0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      app:
        condition: service_healthy
      cadvisor:
        condition: service_started
      container-metadata:
        condition: service_started
      mysql-exporter:
        condition: service_started
      nginx-exporter:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--timeout=4", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.5.8
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yml"]
    # Exception: the Docker log reader needs access to the root-owned socket.
    # The read-only mount does not restrict Docker API verbs; see README.
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/run/promtail
    depends_on:
      loki:
        condition: service_started

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    secrets:
      - grafana_admin_password
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--timeout=4", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

secrets:
  mysql_root_password:
    file: ./.local/secrets/mysql-root-password.txt
  mysql_exporter_password:
    file: ./.local/secrets/mysql-exporter-password.txt
  mysql_exporter_client:
    file: ./.local/secrets/mysql-exporter.cnf
  grafana_admin_password:
    file: ./.local/secrets/grafana-admin-password.txt

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
