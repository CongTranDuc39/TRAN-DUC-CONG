apiVersion: 1

providers:
  - name: Student Management
    orgId: 1
    folder: QLSV
    type: file
    disableDeletion: false
    # Poll instead of relying on filesystem events across Docker Desktop mounts.
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
