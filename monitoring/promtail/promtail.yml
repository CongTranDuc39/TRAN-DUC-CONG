server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /run/promtail/positions.yml
  sync_period: 5s

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    timeout: 10s

scrape_configs:
  - job_name: student-management-docker
    # Docker API supplies log content, stream and timestamps directly. No
    # broad /var/lib/docker glob or Docker JSON-envelope parser is needed.
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values:
              - com.docker.compose.project=qlsv-trancong
    relabel_configs:
      # Fail closed even if the discovery filter is changed accidentally.
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        action: keep
        regex: qlsv-trancong
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        action: keep
        regex: app|nginx|db|phpmyadmin
      - target_label: project
        replacement: student-management
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        replacement: '${1}'
        target_label: container
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
