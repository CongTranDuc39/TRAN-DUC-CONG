# This file is included inside the image's http context.
# Docker DNS refreshes app's address after container recreation.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 3s;

upstream qlsv_app {
    zone qlsv_app 64k;
    server app:3000 resolve;
    keepalive 16;
}

map $http_host $qlsv_host {
    default $http_host;
    ""      $host;
}

# Omit query strings and request bodies from access logs.
log_format qlsv_json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"request_time":$request_time,"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status"}';

server {
    listen 80 default_server;
    server_name localhost;
    server_tokens off;

    access_log /dev/stdout qlsv_json;
    error_log /dev/stderr warn;

    client_max_body_size 32k;
    client_body_timeout 10s;
    send_timeout 15s;

    # Replace upstream Helmet values to emit a single, consistent set at the edge.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Powered-By;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Monitoring is available only on the Docker network, not on the website.
    location ~* ^/metrics(?:/|$) {
        return 404;
    }

    location ~* ^/stub_status(?:/|$) {
        return 404;
    }

    location / {
        proxy_pass http://qlsv_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $qlsv_host;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the single ingress proxy: discard any client-supplied chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_redirect off;
    }
}

# Internal status listener; port 8080 is never published to the host.
server {
    listen 8080;
    server_name nginx;
    server_tokens off;
    access_log off;

    location = /stub_status {
        stub_status;
    }

    location / {
        return 404;
    }
}
